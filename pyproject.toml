
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-processing-toolkit"
version = "0.1.0"
description = "Lightweight video frame extraction for Python and computer vision"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["opencv-python-headless>=4.8", "numpy>=1.24"]

[project.scripts]
video-frames = "video_frame_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
